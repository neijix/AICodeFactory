# A release: push a tag vX.Y.Z on the commit whose engine/VERSION says X.Y.Z and whose
# CHANGELOG.md has a `## [X.Y.Z] - YYYY-MM-DD` section. This checks both, moves the `stable`
# branch (what `install.sh --channel stable` and the session-start pull follow) to the tag, and
# publishes the GitHub release with that section as its notes.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the stable branch is fast-forwarded, never forced

      - name: The tag matches engine/VERSION
        run: |
          version="$(tr -d '[:space:]' < engine/VERSION)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match engine/VERSION ($version): tag v$version, or bump engine/VERSION first"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="$VERSION" '
            index($0, "## [" v "] - ") == 1 && $0 ~ /- [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9][[:space:]]*$/ { on = 1; next }
            on && (/^## \[/ || /^\[[^]]+\]: /) { exit }
            on { print }
          ' CHANGELOG.md | sed -e '/./,$!d' > "$RUNNER_TEMP/notes.md"
          # Trailing blank lines too.
          printf '%s\n' "$(cat "$RUNNER_TEMP/notes.md")" > "$RUNNER_TEMP/notes.md"
          if [ -z "$(tr -d '[:space:]' < "$RUNNER_TEMP/notes.md")" ]; then
            echo "::error::CHANGELOG.md has no '## [$VERSION] - YYYY-MM-DD' section with content: move the Unreleased entries under it first"
            exit 1
          fi
          cat "$RUNNER_TEMP/notes.md"

      - name: Move the stable branch to the release (fast-forward only)
        run: git push origin "HEAD:refs/heads/stable"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
